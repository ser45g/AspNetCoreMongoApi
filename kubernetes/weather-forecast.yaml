apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-forecast
spec:
  selector:
    matchLabels:
      app: weather-forecast
  template:
    metadata:
      labels:
        app: weather-forecast
    spec:
      volumes:
      - name: certificatesvolume
        secret:
          defaultMode: 0777
          secretName: tls-pfx-certificate-secret

      containers:
      - name: weather-forecast
        image: seralex915/aspnetcoremongoapi      
        volumeMounts:
          - name: certificatesvolume
            mountPath: /certs
            readOnly: true
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production  
       
        - name: ASPNETCORE_URLS
          value: "https://+:8081"

        - name: ASPNETCORE_HTTPS_PORTS
          value: "8081"

        - name: Kestrel__Certificates__Default__Path
          value: /certs/pfx-cert

        - name: Kestrel__Certificates__Default__Password
          valueFrom:
            secretKeyRef:
              name: tls-pfx-password-secret
              key: password

        - name: OTEL_EXPORTER_OTLP_HEADERS
          value: X-Seq-ApiKey=abcde12345

        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf

        - name: SeqOptions__Url
          valueFrom:
            configMapKeyRef:
              name: weather-forecast-configmap
              key: seq-url

        - name: MongoDbOptions__Url
          valueFrom:
            configMapKeyRef:
              name: weather-forecast-configmap
              key: mongodb-url

        - name: MongoDbOptions__Username
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-username
        
        - name: MongoDbOptions__Password
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-password
        resources:
            limits:
              cpu: '500m'
              memory: 1024Mi
            requests:
              cpu: '300m'
              memory: 768Mi
        
        ports:
        - containerPort: 8081
