apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      volumes:
      - name: certificatesvolume
        secret:
          defaultMode: 0777
          secretName: mypfx
      containers:
      - name: mongo-express
        image: mongo-express
        volumeMounts:
        - name: certificatesvolume
          mountPath: /certs
          readOnly: true
        resources:
          limits:
            cpu: '500m'
            memory: 1024Mi
          requests:
            cpu: '300m'
            memory: 400Mi
        ports:
        - containerPort: 8081
        env:
        - name: ME_CONFIG_SITE_SSL_ENABLED
          value: "true"
        - name: ME_CONFIG_SITE_SSL_CRT_PATH
          value: /certs/crt
        - name: ME_CONFIG_SITE_SSL_KEY_PATH
          value: /certs/key
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-username
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          valueFrom: 
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-password
        - name: ME_CONFIG_MONGODB_SERVER
          valueFrom: 
            configMapKeyRef:
              name: mongodb-configmap
              key: database_url