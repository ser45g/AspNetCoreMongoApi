services:
  aspnetcoremongoapi:
    image: ${DOCKER_REGISTRY-}aspnetcoremongoapi
    ports:
      - 8081:8081
    build:
      context: .
      dockerfile: AspNetCoreMongoApi/Dockerfile
    environment:
       - "ConnectionStrings__MongoDb=mongodb://root:pwd@mongo:27017/db?authMechanism=SCRAM-SHA-1&authSource=admin"
       - "OTEL_EXPORTER_OTLP_ENDPOINT=http://my-apm:8200"
     
  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: db
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pwd

  mongo-express:
    image: mongo-express
    restart: always
    volumes:
      - mongo-express-data:/data/db
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:pwd@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: root
      ME_CONFIG_BASICAUTH_PASSWORD: pwd

  my-kibana:
    image: kibana:9.0.2
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - 5601:5601
    depends_on:
      - my-elasticsearch

  my-elasticsearch:
    image: elasticsearch:9.0.2
    environment:
      ES_JAVA_OPTS: -Xms2g -Xmx2g 
      cluster.name: "docker-cluster"
      network.host: 0.0.0.0
      discovery.type: single-node
      node.name: my-elasticsearch
      xpack.security.enabled: false
      xpack.security.audit.enabled: false
    ports:
      - 9200:9200
  my-apm:
    image: elastic/apm-server:9.0.2
    volumes:
      - ./apm-server.yml:/usr/share/apm-server/apm-server.yml
    ports:
      - "8200:8200"
    depends_on:
      - my-elasticsearch
  my-logstash:
    image: logstash:9.0.2
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - 5044:5044
    depends_on:
      - my-elasticsearch
volumes:
  mongo-data:
    driver: local  
  mongo-express-data:
    driver: local  
networks:
  otel:
   