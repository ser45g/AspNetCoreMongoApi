services:
  aspnetcoremongoapi:
    image: ${DOCKER_REGISTRY-}aspnetcoremongoapi
    ports:
      - 8081:8081
    build:
      context: .
      dockerfile: AspNetCoreMongoApi/Dockerfile
    environment:
       - "MongoDbOptions__Username=root"
       - "MongoDbOptions__Password=pwd"
       - "MongoDbOptions__Url=mongo:27017"
       - "SeqOptions__Url=seq-dashboard:5341"
       - "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
       - "OTEL_EXPORTER_OTLP_HEADERS=X-Seq-ApiKey=abcde12345"      
  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: db
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pwd

  mongo-express:
    image: mongo-express
    restart: always
    volumes:
      - mongo-express-data:/data/db
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:pwd@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: root
      ME_CONFIG_BASICAUTH_PASSWORD: pwd
  seq-dashboard:
    image: datalust/seq
    volumes:
      - seq-data:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_PASSWORD=pwd
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=pwd
      - SEQ_API_CANONICALURI=https://seq.example.com
    ports:
      - 5341:5341
      - 8083:80
volumes:
    
  mongo-data:
    driver: local  
  mongo-express-data:
    driver: local  
  seq-data:
    driver: local
networks:
  otel:
   