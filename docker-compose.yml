services:
  aspnetcoremongoapi:
    image: ${DOCKER_REGISTRY-}aspnetcoremongoapi
    ports:
      - 8081:8081
    build:
      context: .
      dockerfile: AspNetCoreMongoApi/Dockerfile
    environment:
       - CorsOptions__AllowedOrigins__0=http://localhost:5173
       - CorsOptions__AllowedOrigins__1=http://localhost:5174
       - "MongoDbOptions__Username=${MONGO_INITDB_ROOT_USERNAME}"
       - "MongoDbOptions__Password=${MONGO_INITDB_ROOT_PASSWORD}"
       - "MongoDbOptions__Url=mongo:27017"

       - "AuthenticationOptions__MetadataAddress=http://keycloak:8080/realms/auth_demo/.well-known/openid-configuration"
       - "AuthenticationOptions__ValidIssuer=http://localhost:8080/realms/auth_demo"
       - "AuthenticationOptions__AuthorizationUrl=http://localhost:8080/realms/auth_demo/protocol/openid-connect/auth"
       - "AuthenticationOptions__TokenUrl=http://localhost:8080/realms/auth_demo/protocol/openid-connect/token"
       - "AuthenticationOptions__RefreshUrl=http://localhost:8080/realms/auth_demo/protocol/openid-connect/token"
       - "AuthenticationOptions__Audience=public-client"
       - "AuthenticationOptions__ClientId=public-client"
       - "AuthenticationOptions__RequireHttps=false"

       - "AuthenticationOptions__Scopes__public-client-audience-scope=public-client-audience-scope"
       - "AuthenticationOptions__Scopes__profile=profile"
       - "AuthenticationOptions__Scopes__openid=openid"

       - "SeqOptions__Url=seq-dashboard:5341"
       - "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
       - "OTEL_EXPORTER_OTLP_HEADERS=X-Seq-ApiKey=${X_SEQ_API_KEY_HEADER}"

       - "RedisOptions__Configuration=redis:6379,password=redis,abortConnect=false" 
       - "RedisOptions__Password=${REDIS_PASSWORD}"
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    command: start-dev
    volumes:
      - ./keycloak-imports:/opt/jboss/keycloak/imports
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: postgres_keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_IMPORT: /opt/jboss/keycloak/imports/realm-export.json -Dkeycloak.profile.feature.upload_scripts=enabled
    ports:
    - 8080:8080

  postgres_keycloak:
    container_name: postgres_keycloak
    image: postgres:19beta1
    environment:
      POSTGRES-DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql
  mongo:
    image: mongo:8.2.7
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_ROOT_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    restart: always
    volumes:
      - mongo-express-data:/data/db
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGOEXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGOEXPRESS_PASSWORD}
  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
  redis-insight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data
  seq-dashboard:
    image: datalust/seq:2025.2
    volumes:
      - seq-data:/data:2025.2
    environment:
      - ACCEPT_EULA=Y
      - SEQ_PASSWORD=${SEQ_PASSWORD}
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=${SEQ_FIRSTRUN_ADMINPASSWORDHASH}
      - SEQ_API_CANONICALURI=https://seq.example.com
    ports:
      - 5341:5341
      - 8083:80
volumes:
  postgres-keycloak-data:
  mongo-data:
  mongo-express-data:
  seq-data:
  redis-data:
  redis-config:
  redis-insight:
   