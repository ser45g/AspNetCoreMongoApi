services:
  aspnetcoremongoapi:
    image: ${DOCKER_REGISTRY-}aspnetcoremongoapi
    container_name: aspnetcoremongoapi
    depends_on:
      keycloak:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=3", "--spider", "https://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - 8081:8081
    build:
      context: .
      dockerfile: AspNetCoreMongoApi/Dockerfile
    environment:
       - CorsOptions__AllowedOrigins__0=http://localhost:5173
       - CorsOptions__AllowedOrigins__1=http://localhost:5174

       - "DbOptions__ConnectionString=User Id=${DB_DB_USERNAME};Password=${DB_DB_PASSWORD};Server=db;Port=5432;Database=${DB_DB}"
      
       - "AuthenticationOptions__MetadataAddress=http://keycloak:8080/realms/auth_demo/.well-known/openid-configuration"
       - "AuthenticationOptions__ValidIssuer=http://localhost:8080/realms/auth_demo"
       - "AuthenticationOptions__AuthorizationUrl=http://localhost:8080/realms/auth_demo/protocol/openid-connect/auth"
       - "AuthenticationOptions__TokenUrl=http://localhost:8080/realms/auth_demo/protocol/openid-connect/token"
       - "AuthenticationOptions__RefreshUrl=http://localhost:8080/realms/auth_demo/protocol/openid-connect/token"
       - "AuthenticationOptions__Audience=${AUTHENTICATION_AUDIENCE}"
       - "AuthenticationOptions__ClientId=${AUTHENTICATION_CLIENTID}"
       - "AuthenticationOptions__RequireHttps=false"
       - "AuthenticationOptions__Scopes__public-client-audience-scope=public-client-audience-scope"
       - "AuthenticationOptions__Scopes__profile=profile"
       - "AuthenticationOptions__Scopes__openid=openid"

       - "KeycloakClientOptions__Secret=${KEYCLOAK_CLIENT_SECRET}"
       - "KeycloakClientOptions__Realm=auth_demo"
       - "KeycloakClientOptions__ClientId=${KEYCLOAK_CLIENT_CLIENTID}"
       - "KeycloakClientOptions__AuthServerUrl=http://keycloak:8080/"
       - "KeycloakClientOptions__TokenUrl=http://keycloak:8080/realms/auth_demo/protocol/openid-connect/token"

       - "OTEL_EXPORTER_OTLP_ENDPOINT=http://seq-dashboard:5341/ingest/otlp/v1/traces"
       - "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
       - "OTEL_EXPORTER_OTLP_HEADERS=X-Seq-ApiKey=${X_SEQ_API_KEY_HEADER}"

       - "RedisOptions__Configuration=redis:6379,password=${REDIS_PASSWORD},abortConnect=false" 
       - "RedisOptions__Password=${REDIS_PASSWORD}"

       - "ElasticSearchOptions__Url=http://elasticsearch:9200"
       - "ElasticSearchOptions__LocalUsername=${ELASTICSEARCH_USERNAME}"
       - "ElasticSearchOptions__LocalPassword=${ELASTICSEARCH_PASSWORD}"
       - "ElasticSearchOptions__IsSslUsed=false"

       - "RabbitMqOptions__Url=amqp://rabbitmq:5672"
       - "RabbitMqOptions__Username=${RABBITMQ_USER}"
       - "RabbitMqOptions__Password=${RABBITMQ_PASSWORD}"

       - "MailOptions__DisplayName=My app"
       - "MailOptions__From=sergey1pes@gmail.com"
       - MailOptions__Host=papercut
       - "MailOptions__Port=2525"
       - "MailOptions__UserName=user1"
       - "MailOptions__Password=user1"
       - MailOptions__IsAuthenticated=false

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    command: start-dev --import-realm
    depends_on:
      postgres_keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
    - ./keycloak/realm-import:/opt/keycloak/data/import:ro
    - ./keycloak/rabbitmq-integration:/opt/keycloak/providers
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: postgres_keycloak
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_IMPORT: /opt/jboss/keycloak/imports/realm-export.json -Dkeycloak.profile.feature.upload_scripts=enabled

      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}

      KK_TO_RMQ_URL: rabbitmq
      KK_TO_RMQ_PORT: 5672
      KK_TO_RMQ_VHOST: /
      KK_TO_RMQ_EXCHANGE: keycloak-events
      KK_TO_RMQ_USERNAME: ${RABBITMQ_USER}
      KK_TO_RMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KK_TO_RMQ_USE_TLS: false
      
      # KK_TO_RMQ_KEY_STORE - default: empty
      # KK_TO_RMQ_KEY_STORE_PASS - default: empty
      # KK_TO_RMQ_TRUST_STORE - default: empty
      # KK_TO_RMQ_TRUST_STORE_PASS - default: empty
    ports:
    - 8080:8080

  postgres_keycloak:
    container_name: postgres_keycloak
    image: postgres:19beta1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 1
      start_period: 10s
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql
  papercut:
    image: changemakerstudiosus/papercut-smtp:7.7.3-alpha.7
    container_name: papercut
    ports:
      - "8093:8080"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
     # - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    container_name: db
    image: postgres:19beta1
    environment:
      POSTGRES_DB: ${DB_DB}
      POSTGRES_USER: ${DB_DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_DB_USERNAME} -d ${DB_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-db-data:/var/lib/postgresql

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  redis-insight:
    image: redis/redisinsight:3.4
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5540/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data

  seq-dashboard:
    image: datalust/seq:2025.2
    volumes:
      - seq-data:/data:2025.2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - ACCEPT_EULA=Y
      - SEQ_PASSWORD=${SEQ_PASSWORD}
      - SEQ_API_CANONICALURI=https://seq.example.com
    ports:
      - 5341:5341
      - 8083:80
  elasticsearch:
    image: elasticsearch:9.4.2
    container_name: elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "elastic:${ELASTICSEARCH_PASSWORD}", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  kibana:
    image: kibana:9.4.2
    ports:
      - 5601:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${KIBANA_USERNAME}
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
volumes:
  postgres-keycloak-data:
  mongodb1-data:
  mongodb2-data:
  mongodb3-data:
  mongo-express-data:
  seq-data:
  redis-data:
  redis-config:
  redis-insight:
  elasticsearch-data:
  postgres-db-data:
  rabbitmq_data:
   